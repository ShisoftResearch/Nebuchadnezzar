[package]
name = "neb"
version = "0.2.0"
authors = ["Hao Shi <shisoftgenius@gmail.com>"]
edition = "2021"

[lib]
name = "neb"

[dependencies]
libc = "*"
log = "*"
lazy_static = "*"
bifrost = { path = "../bifrost" }
bifrost_plugins = { path = "../bifrost/src/plugins" }
bifrost_proc_macro = { path = "../bifrost/src/proc_macro" }
bifrost_hasher = { path = "../bifrost/src/hasher" }
dovahkiin = { path = "../Dovahkiin" }
lightning-containers = { git = "ssh://git@192.168.10.134/shisoft-x/Lightning.git", branch = "develop"}
rayon = "*"
serde = "*"
serde_derive = "*"
bincode = "2"
bincode_derive = "2"
byteorder = "*"
parking_lot = "*"
rand = { version = "*", features = ["small_rng"] }
itertools = "*"
smallvec = { version = "*", features = ["serde", "union"] }
num_cpus = "*"
static_assertions = "*"
serde_json = "*"
futures = {version = "0.3", features = ["executor", "thread-pool"] }
futures-timer = "3"
async-std = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
crossbeam = "*"
crossbeam-epoch = "*"
num = "*"
core_affinity = "0.8.1"
ndarray = "0.16.1"
crc32fast = "*"
lz4_flex = { version = "0.12", default-features = false }

# Full-text search tokenization
unicode-normalization = "0.1"
rust-stemmers = "1.2"
jieba-rs = "0.7"
lindera = { version = "0.30", features = ["ipadic"] }
crc-fast = "1.10.0"

[features]
default = [
    "cleaner", "combine_cleaner", 
    "tiered_memory", "compress_backups"
]

cleaner = []
combine_cleaner = ["cleaner"]
occ_phase_profile = []

# Enable CRC32 checksum verification during eviction and promotion
debug_verify_checksums = ["tiered_memory"]

# Enable LZ4 compression for segment backup files
# Reduces disk I/O bottleneck during eviction by 30-70%
# Decompression is always enabled (auto-detects compressed files)
# Default: enabled for better disk I/O performance
# Usage: cargo build --no-default-features --features ... (exclude compress_backups)
compress_backups = []

tiered_memory = []

[dev-dependencies]
env_logger = "*"
rayon = "*"
tempfile = "*"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bench]]
name = "inverted_index"
harness = false

[[bench]]
name = "occ_transactions"
harness = false
