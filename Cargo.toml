[package]
name = "neb"
version = "0.2.0"
authors = ["Hao Shi <shisoftgenius@gmail.com>"]
edition = "2021"

[lib]
name = "neb"

[dependencies]
libc = "*"
log = "*"
lazy_static = "*"
bifrost = { git = "https://github.com/shisoft/bifrost", branch = "develop" }
bifrost_plugins = { git = "https://github.com/shisoft/bifrost", branch = "develop" }
bifrost_proc_macro = { git = "https://github.com/shisoft/bifrost", branch = "develop" }
bifrost_hasher = { git = "https://github.com/shisoft/bifrost", branch = "develop" }
dovahkiin = { git = "https://github.com/ShisoftResearch/Dovahkiin.git", branch = "develop" }
lightning-containers = { git = "ssh://git@192.168.10.134/shisoft-x/Lightning.git", branch = "develop"}
rayon = "*"
serde = "*"
serde_derive = "*"
bincode = "2"
bincode_derive = "2"
byteorder = "*"
parking_lot = "*"
rand = { version = "*", features = ["small_rng"] }
bitflags = "*"
itertools = "*"
smallvec = { version = "*", features = ["serde", "union"] }
num_cpus = "*"
static_assertions = "*"
serde_json = "*"
futures = {version = "0.3", features = ["executor", "thread-pool"] }
futures-timer = "3"
async-std = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
crossbeam = "*"
crossbeam-epoch = "*"
num = "*"
core_affinity = "0.8.1"
ndarray = "0.16.1"
crc32fast = "*"
lz4_flex = { version = "0.12", default-features = false }

[features]
# Enable zero-overhead page fault tracking via mprotect/SIGSEGV
# When disabled (default), segments are marked as referenced directly during reads
# Can be enabled for production use to get zero-overhead reference tracking
# Default: disabled to avoid signal handler conflicts in tests
default = ["cleaner", "combine_cleaner", "compact_cleaner", "tiered_memory", "compress_backups"]
page_fault_tracking = ["tiered_memory"]

cleaner = []
# Enable combine cleaner: merges multiple sparse segments into dense ones
# This improves memory utilization by consolidating fragmented segments
# Default: enabled for better memory efficiency
combine_cleaner = ["cleaner"]
# Enable compact cleaner: compacts segments to reclaim dead space
compact_cleaner = ["cleaner"]

# Enable verbose page fault logging (only works in debug builds + page_fault_tracking feature)
# Usage: cargo build --features debug_page_faults
debug_page_faults = ["page_fault_tracking"]

# Enable CRC32 checksum verification during eviction and promotion
# Only works in debug builds (debug_assertions must be enabled)
# Usage: cargo build --features verify_checksums
debug_verify_checksums = ["tiered_memory"]

# Enable LZ4 compression for segment backup files
# Reduces disk I/O bottleneck during eviction by 30-70%
# Decompression is always enabled (auto-detects compressed files)
# Default: enabled for better disk I/O performance
# Usage: cargo build --no-default-features --features ... (exclude compress_backups)
compress_backups = []

tiered_memory = []

[dev-dependencies]
env_logger = "*"
rayon = "*"
tempfile = "*"
